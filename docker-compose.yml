version: '3.8'

services:
  # ==========================================
  # 1. Base de Datos Principal (PostgreSQL + PostGIS)
  # ==========================================
  db:
    image: postgis/postgis:16-3.4
    container_name: milojos-postgis
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-milojos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Autoejecuta el schema inicial de MilOjos
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
      - ./database/rls_policies.sql:/docker-entrypoint-initdb.d/03_rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis (Para WebSockets de Pánico y Rate Limiting)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: milojos-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

  # ==========================================
  # 3. API Backend (NestJS Node 20)
  # ==========================================
  nest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milojos-api
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-milojos}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    ports:
      - "3000:3000" # REST y WebSockets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ==========================================
  # 4. Servidor de Señalización y Video (MediaSoup Worker C++)
  # ==========================================
  mediasoup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.mediasoup
    container_name: milojos-video-worker
    network_mode: "host" # REQUIERE host mode para mapear miles de puertos UDP (WebRTC)
    environment:
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${PUBLIC_IP:-127.0.0.1}
      - MEDIASOUP_MIN_PORT=10000
      - MEDIASOUP_MAX_PORT=59999
    restart: always

volumes:
  pgdata:
  redisdata:

name: MilOjos CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  flutter-test:
    name: "Flutter QA (Lints & App Unit Tests)"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar Dependencias Mobile
        working-directory: ./mobile
        run: flutter pub get
        
      - name: Analizar Sintaxis e Higiene (Lints)
        working-directory: ./mobile
        run: flutter analyze

      - name: Compilar y correr Pruebas Unitarias de Pánico
        working-directory: ./mobile
        run: flutter test --coverage

  nestjs-test:
    name: "Backend Auth & Sockets Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: milojos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: NPM Install Dependencies
        working-directory: ./backend
        run: npm ci || npm install
        
      - name: Ejecutar Jest Unit & E2E Tests
        working-directory: ./backend
        run: npm run test
        env:
          DATABASE_URL: postgresql://test:password@localhost:5432/milojos_test
